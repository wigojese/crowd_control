# UNVERIFIED: written in Stage 07, never executed (no GitHub Actions run was triggered or read).
name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python checks (lint, lint self-test, scenario validator, golden files)
        run: |
          python3 -I scripts/lint.py
          python3 -I scripts/test_lint.py
          python3 -I scripts/validate_scenarios.py --fixtures
          python3 -I scripts/check_golden.py
      - name: Install Godot 4.7.2 and verify its checksum
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fsSL -O "$base/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSL -O "$base/SHA512-SUMS.txt"
          grep " Godot_v4.7.2-stable_linux.x86_64.zip$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Engine checks
        run: |
          godot --headless --path . --import
          godot --headless --path . --script res://tools/test_runner.gd
          godot --headless --path . --script res://tools/scenario_runner.gd -- res://tests/fixtures/scenario_ok.json
          godot --headless --path . --quit-after 2 | tee boot.log
          grep -q "BOOT_STATE=READY" boot.log
